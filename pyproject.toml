[project]
name = "switchboard"
version = "0.1.0"
description = "Route each prompt to the cheapest model that can still answer it correctly, and measure the saving."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx==0.28.1",
    "huggingface-hub==2.0.0",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchboard"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "T20", "BLE", "E722"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["switchboard"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not docker'"
markers = [
    "integration: needs a live service (vLLM server); run with -m integration",
    "docker: needs a working Docker daemon; run with -m docker",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260914",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "ruff==0.16.9",
    "types-pyyaml==6.0.12.20260906",
]
